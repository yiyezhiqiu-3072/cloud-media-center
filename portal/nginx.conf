# ============================================================================
#  nginx.conf  —— 在原配置基础上合并「云媒中心」统一入口
#
#  改动说明（详细步骤见 portal/README.md）：
#    1. 原有 8080（html）、8081（html2）两个站点原样保留，一行未改
#    2. 80 端口：门户页公开 → 点卡片弹自定义登录页 → 进入 /radio/ 或 /tv/
#    3. 【本次改造】去掉 nginx 自带的浏览器 Basic Auth 弹框，
#       改由 CloudAuth 服务（127.0.0.1:8092）校验账号并签发签名 Cookie
#    4. 因为 8080/8081 已被原有站点占用，云收音机 8090、云电视 8091
#       （对应两个程序 config.json 里的 port，务必同步修改）
# ============================================================================

#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # 域名统一写在这里，将来有域名只改这一处（server_name _ 表示匹配任意）
    # set_real_ip_from 等如需可另配

    # ========================================================================
    #  【原有】站点一：8080 → html 目录
    #  保持原样，未做任何修改
    # ========================================================================
    server {
        listen       8080;
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
            root   html;
            index  index.html index.htm;

         try_files $uri $uri/ /index.html;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # ========================================================================
    #  【原有】站点二：8081 → html2 目录
    #  保持原样，未做任何修改
    # ========================================================================
    server {
        listen       8081;                # 换一个端口
        server_name  localhost;

        location / {
            root   html2;                 # 指向新的目录
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;   # 如果是 history 路由
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html2;
        }
    }

    # ========================================================================
    #  【新增】统一入口：80 端口
    #
    #  访问流程：浏览器打开 http://服务器IP/
    #            → 直接看到门户首页（不需要登录）
    #            → 点「进入收听 / 进入观看」弹出自定义登录页（左侧天气、右侧表单）
    #            → 登录成功后浏览器带签名 Cookie 进入 /radio/ 或 /tv/
    #
    #  前置条件（缺一不可）：
    #    · 门户页、登录页放到 nginx/html_portal/（index.html / login.html / status.html）
    #    · 账号文件 conf/htpasswd 仍在，双击 make-htpasswd.bat 生成/修改（不需要 Python）
    #      现在由 CloudAuth 读取校验，不再由 nginx 的 auth_basic 读取
    #    · CloudAuth.exe 已启动，监听 127.0.0.1:8092
    #    · 云收音机 config.json：port=8090、host=127.0.0.1、trust_proxy_auth=true
    #    · 云电视   config.json：port=8091、host=127.0.0.1
    #    · 两个后端都换成支持统一会话的新版 exe（v1.5.7 / v1.3.5）
    # ========================================================================
    server {
        listen       80;
        server_name  _;                   # 有域名就改成你的域名

        # 门户页目录（与原有 html、html2 分开，互不影响）
        root   html_portal;
        index  index.html;

        charset utf-8;

        # 【本次改造】这里刻意不写 auth_basic：
        # 浏览器自带的 Basic 登录框无法美化，改由自定义登录页 + CloudAuth 会话控制。
        # htpasswd 文件依旧是唯一的账号库，make-htpasswd.bat 的用法完全不变。

        # ---- 门户首页：公开 ----
        location = / {
            try_files /index.html =404;
        }

        # ---- 自定义登录页：公开 ----
        location = /login.html {
            try_files /login.html =404;
            add_header Cache-Control "no-store";
        }

        # ---- 其余静态文件（图标等） ----
        location / {
            try_files $uri $uri/ =404;
        }

        # ---- 统一登录服务：8092 ----
        # /auth/login  校验账号并下发签名 Cookie
        # /auth/check  给两个后端校验 Cookie（也可用于 nginx auth_request）
        # /auth/session、/auth/logout、/auth/health 供门户页面使用
        # /auth/weather 国内天气代理（登录页与两个应用的天气组件共用）
        location /auth/ {
            proxy_pass http://127.0.0.1:8092/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;      # 天气按访客 IP 定位
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 30s;             # 天气首次取数需串几次国内接口
        }

        # ---- 少的结尾斜杠会让页面里的相对路径全部失效，统一补上 ----
        location = /radio { return 301 /radio/; }
        location = /tv    { return 301 /tv/; }
        location = /music { return 301 /music/; }
        location = /work  { return 301 /work/; }

        # ---- 云收音机：8090 ----
        # proxy_pass 结尾的 / 是关键：它会把 /radio 前缀去掉再转发，
        # 后端仍然按 /api/... 这类根路径工作，程序无需改代码。
        # 无会话 Cookie 时先跳登录页（快速路径）；有 Cookie 时后端还会再校验一次签名，
        # 伪造 Cookie 进不去，安全性由 CloudAuth 保证。
        location /radio/ {
            if ($cookie_cm_session = "") { return 302 /login.html?next=/radio/; }

            proxy_pass http://127.0.0.1:8090/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;      # 后端日志用这个记录真实 IP
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /radio;           # 后端据此生成正确跳转地址
            proxy_set_header X-Auth-User       $remote_user;      # 兼容旧逻辑；新版后端主要看 Cookie
            proxy_set_header Connection        "";

            # 直播音频不能缓冲，否则前端一直转圈；超时放宽到 1 小时
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- 云电视：8091 ----
        location /tv/ {
            if ($cookie_cm_session = "") { return 302 /login.html?next=/tv/; }

            proxy_pass http://127.0.0.1:8091/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /tv;
            proxy_set_header X-Auth-User       $remote_user;
            proxy_set_header Connection        "";

            proxy_buffering    off;             # 视频分片同样不能缓冲
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 4m;            # 导入 M3U 播放列表时用得上
        }

        # ---- 云音乐：8093 ----
        # 与 /radio/、/tv/ 同构；audio 同样不能缓冲，且上传音乐需要放大 body 限制。
        location /music/ {
            if ($cookie_cm_session = "") { return 302 /login.html?next=/music/; }

            proxy_pass http://127.0.0.1:8093/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /music;
            proxy_set_header X-Auth-User       $remote_user;
            proxy_set_header Connection        "";

            proxy_buffering    off;             # 音频流式播放不能缓冲
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            # 音乐上传走 base64，请求体会膨胀约 4/3：后端单首上限 200MB
            # → 请求体最大约 267MB，这里留余量给 JSON 外壳。改 max_upload_mb 时需同步放大
            client_max_body_size 280m;
        }

        # ---- 工作日志：8094 ----
        # 纯 JSON 小数据，不需要放大 body 限制 / 关缓冲；与上面三个应用同构。
        location /work/ {
            if ($cookie_cm_session = "") { return 302 /login.html?next=/work/; }

            proxy_pass http://127.0.0.1:8094/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /work;
            proxy_set_header X-Auth-User       $remote_user;
            proxy_set_header Connection        "";
        }

        # ---- 运行状态页 ----
        # /status        → 跳到状态页（页面放在 html_portal/status.html）
        # /nginx_status  → nginx 自带的原始指标（纯文本，由 stub_status 模块输出）
        # 状态页不暴露服务内容，用「有无会话 Cookie」做一层轻量门禁。
        location = /status {
            return 302 /status.html;
        }
        location = /status.html {
            if ($cookie_cm_session = "") { return 302 /login.html?next=/status.html; }
            try_files /status.html =404;
            add_header Cache-Control "no-store";
        }
        location = /nginx_status {
            if ($cookie_cm_session = "") { return 401; }
            stub_status;
            access_log off;                  # 状态页每 2 秒读一次，别把访问日志刷爆
            add_header Cache-Control "no-store";
        }

        # 顺手挡掉 .git / .env 之类的探测，减少日志噪音
        location ~ /\.(?!well-known) {
            deny all;
        }

        # 这里故意【不】写 error_page 50x：
        # 之前指向 /50x.html，但门户目录里并没有这个文件，一旦出错反而变成 404，
        # 把真实的 500 / 502 盖掉了，排查时看不到真相。现在原样返回状态码。
        # 想美化错误页，就在 html_portal 里放一个 50x.html，再把下面两行打开：
        # error_page   500 502 503 504  /50x.html;
        # location = /50x.html { root   html_portal; }
    }

    # 提示：上面 8080 / 8081 两个原有站点仍然是公开的，不受统一登录影响。
    #       如果也要保护，可在对应 server 块里加同样的 Cookie 门禁。

    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    #server {
    #    listen       8000;
    #    listen       somename:8080;
    #    server_name  somename  alias  another.alias;
    #
    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}

    # HTTPS server
    #
    # 将来有域名和证书后，把上面的 80 端口 server 复制一份改成 443，
    # 加上下面几行，并把 80 改成为 301 跳转到 https。
    #server {
    #    listen       443 ssl;
    #    server_name  localhost;
    #
    #    ssl_certificate      cert.pem;
    #    ssl_certificate_key  cert.key;
    #
    #    ssl_session_cache    shared:SSL:1m;
    #    ssl_session_timeout  5m;
    #
    #    ssl_ciphers  HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers  on;
    #
    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}
}
