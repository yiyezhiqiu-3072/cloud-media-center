<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>登录 · 云收音机</title>
<style>
  :root {
    --bg: #f4efe6; --surface: #fffcf7; --ink: #1f1b18; --ink-2: #4a423a;
    --muted: #8b8177; --line: #e6dccc; --accent: #b65c33; --accent-2: #d98b4a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(900px 520px at 85% -10%, #fdf6ea 0%, rgba(253,246,234,0) 60%),
      radial-gradient(800px 480px at 5% 105%, #efe4d2 0%, rgba(239,228,210,0) 55%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 372px;
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 20px;
    box-shadow: 0 18px 50px rgba(60, 44, 28, .10);
    padding: 30px 26px 22px;
  }
  .logo { color: var(--accent); display: flex; justify-content: center; margin-bottom: 10px; }
  h1 {
    margin: 0; text-align: center; font-size: 21px; font-weight: 600;
    font-family: "Songti SC", "STSong", Georgia, serif; letter-spacing: .08em;
  }
  .sub { margin: 6px 0 22px; text-align: center; font-size: 12px; color: var(--muted); }
  label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 12px; letter-spacing: .04em; }
  input {
    width: 100%; margin-top: 6px; padding: 11px 13px;
    background: #fffdf9; border: 1px solid var(--line); border-radius: 11px;
    font-size: 14px; color: var(--ink); outline: none; font-family: inherit;
    transition: border-color .16s, box-shadow .16s;
  }
  input:focus { border-color: #cbb79c; box-shadow: 0 0 0 3px rgba(182, 92, 51, .08); }
  button {
    width: 100%; margin-top: 6px; padding: 12px;
    border: 0; border-radius: 11px; cursor: pointer;
    background: linear-gradient(160deg, #e7a469, #b65c33);
    color: #2a1a10; font-size: 14px; font-weight: 600; font-family: inherit;
    box-shadow: 0 6px 18px rgba(182, 92, 51, .28);
    transition: transform .14s ease, opacity .16s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: scale(.99); }
  button[disabled] { opacity: .6; cursor: default; transform: none; }
  .error {
    margin: 0 0 12px; padding: 9px 11px; border-radius: 9px;
    background: #fdeee9; border: 1px solid #f3d2c7; color: #a8452a;
    font-size: 12px; line-height: 1.5; display: none;
  }
  .error.show { display: block; }
  .foot {
    margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line);
    font-size: 11px; color: #8b8177; text-align: center; line-height: 1.75;
  }
  .caps { font-size: 10.5px; color: #b5764f; text-align: center; margin-top: 8px; display: none; }
  .caps.show { display: block; }
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 48 48" width="54" height="54">
      <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".35"/>
      <circle cx="24" cy="24" r="3" fill="currentColor"/>
      <path d="M24 11a13 13 0 0 1 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
      <path d="M24 4a20 20 0 0 1 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>
      <path d="M24 37a13 13 0 0 1-13-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
      <path d="M24 44A20 20 0 0 1 4 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>
    </svg>
  </div>
  <h1>云收音机</h1>
  <p class="sub">请登录后收听</p>

  <p class="error" id="error" role="alert"></p>

  <label>用户名
    <input id="username" name="username" type="text" autocomplete="username" spellcheck="false" required autofocus>
  </label>
  <label>密码
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </label>

  <button type="submit" id="submit">登录</button>
  <p class="caps" id="caps">已开启大写锁定</p>

  <div class="foot">
    登录状态保持 30 天，超时需重新登录<br>
    账号密码保存在服务器的 config.json 中
  </div>
</form>

<script>
(() => {
  const form = document.getElementById('form');
  const errBox = document.getElementById('error');
  const btn = document.getElementById('submit');
  const userInput = document.getElementById('username');
  const pwdInput = document.getElementById('password');
  const caps = document.getElementById('caps');

  pwdInput.addEventListener('keyup', (e) => {
    if (typeof e.getModifierState === 'function') {
      caps.classList.toggle('show', e.getModifierState('CapsLock'));
    }
  });

  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');
    const username = userInput.value.trim();
    const password = pwdInput.value;
    if (!username || !password) {
      showError('请输入用户名和密码');
      return;
    }
    btn.disabled = true;
    btn.textContent = '登录中…';
    try {
      const res = await fetch('api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        location.replace('./');
        return;
      }
      showError(data.message || (res.status === 429 ? '尝试次数过多，请稍后再试' : '登录失败，请重试'));
    } catch (err) {
      showError('连不上服务器，请检查网络或后端是否在运行');
    }
    btn.disabled = false;
    btn.textContent = '登录';
    pwdInput.select();
  });
})();
</script>
</body>
</html>
