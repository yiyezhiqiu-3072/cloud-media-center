<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>云收音机 · 全国广播直播</title>
<meta name="description" content="无广告的网络收音机，自动同步全国广播电台直播流，本地直接播放。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="38" height="38">
        <circle cx="24" cy="24" r="22" fill="none" stroke="currentColor" stroke-width="1.4" opacity=".35"/>
        <circle cx="24" cy="24" r="3" fill="currentColor"/>
        <path d="M24 11a13 13 0 0 1 13 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
        <path d="M24 4a20 20 0 0 1 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
        <path d="M24 37a13 13 0 0 1-13-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
        <path d="M24 44A20 20 0 0 1 4 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".45"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>云收音机</h1>
      <p>全国广播直播 · 无广告 · 自动同步线路</p>
    </div>
  </div>
  <div class="topbar-right">
    <a class="btn ghost nav-link" id="homeBtn" href="../" title="返回门户主页" hidden>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11l8-7 8 7"/><path d="M6 10.5V19h12v-8.5"/>
      </svg>
      <span>首页</span>
    </a>
    <a class="btn ghost nav-link" id="statusBtn" href="../status" target="_blank" rel="noopener" title="查看运行状态（新标签页打开）" hidden>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h4l2.5-7 4 14 2.5-7h5"/>
      </svg>
      <span>状态</span>
    </a>
    <div class="status" id="statusPill">
      <span class="pulse" id="statusDot"></span>
      <span id="statusText">正在连接频道库…</span>
    </div>
    <button class="btn ghost" id="listenBtn" title="查看当前谁在听什么">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M4 15a2 2 0 0 1 2-2h1v6H6a2 2 0 0 1-2-2zM20 15a2 2 0 0 0-2-2h-1v6h1a2 2 0 0 0 2-2z"/>
      </svg>
      <span>在线 <b id="listenCount">0</b></span>
    </button>
    <button class="btn ghost" id="refreshBtn" title="立即重新抓取并校验频道">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M20 11a8 8 0 1 0-2.6 6"/><path d="M20 4v7h-7"/>
      </svg>
      <span>更新频道库</span>
    </button>
    <button class="btn ghost" id="logoutBtn" title="退出登录" hidden>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/>
      </svg>
      <span>退出</span>
    </button>
    <div class="weather-chip" id="weatherChip" title="正在获取天气…" role="button" tabindex="0" aria-label="当前天气">
      <span class="w-icon" id="wIcon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 17.5h11.5a3.6 3.6 0 0 0 .3-7.2 5.3 5.3 0 0 0-10-1.1A3.8 3.8 0 0 0 6 17.5z" fill="currentColor" opacity=".85"/></svg>
      </span>
      <span class="w-temp" id="wTemp">--°</span>
      <span class="w-city" id="wCity">天气</span>
    </div>
    <span class="ver-chip" id="appVersion" data-version-url="api/meta" data-assets-url="api/assets" data-version-label="云收音机" data-app-key="radio" hidden></span>
  </div>
</header>

<main class="layout">
  <aside class="rail">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索电台 / 地区 / 类型" autocomplete="off" spellcheck="false">
      <button class="clear" id="clearSearch" hidden aria-label="清除">×</button>
    </div>

    <nav class="nav" id="catNav" aria-label="分类"></nav>

    <div class="rail-block">
      <label class="rail-label" for="regionSelect">地区</label>
      <div class="select-wrap">
        <select id="regionSelect"></select>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <div class="rail-block recent-block">
      <span class="rail-label">最近播放</span>
      <div id="recentList" class="recent-list"><p class="hint">还没有播放记录</p></div>
    </div>

    <div class="rail-foot">
      <span id="metaLine">—</span>
      <span class="tiny">本服务不加载任何广告或追踪脚本</span>
    </div>
  </aside>

  <section class="list-pane">
    <div class="list-head">
      <div class="list-title-wrap">
        <h2 id="listTitle">全部电台</h2>
        <span class="count" id="listCount">—</span>
      </div>
      <div class="list-tools">
        <button class="chip-btn" data-sort="default" id="sortDefault">推荐排序</button>
        <button class="chip-btn" data-sort="latency" id="sortLatency">低延迟优先</button>
      </div>
    </div>

    <div id="channelList" class="channel-list" role="list"></div>

    <div class="skeletons" id="skeletons">
      <div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div>
      <div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div>
    </div>

    <div class="empty" id="emptyState" hidden>
      <div class="empty-icon">📻</div>
      <h3>没有匹配的电台</h3>
      <p>换个关键词，或把分类切回「全部」。</p>
      <button class="btn solid" id="resetFilters">重置筛选</button>
    </div>
  </section>
</main>

<div class="player" id="player" data-playing="false">
  <div class="player-inner">
    <div class="now">
      <div class="art" id="art">
        <span id="artInitial">收</span>
        <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="now-text">
        <div class="now-title" id="nowTitle">选一个电台开始收听</div>
        <div class="now-sub" id="nowSub">频道库由本地服务自动维护</div>
      </div>
    </div>

    <div class="transport">
      <button class="icon-btn" id="prevBtn" aria-label="上一个电台" title="上一个 (P)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M7 5h2v14H7zM20 5v14l-9-7z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" aria-label="播放/暂停" title="播放 / 暂停 (空格)">
        <svg class="i-play" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <button class="icon-btn" id="nextBtn" aria-label="下一个电台" title="下一个 (N)">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15 5h2v14h-2zM4 5v14l9-7z"/></svg>
      </button>
    </div>

    <div class="player-extra">
      <div class="live-tag" id="liveTag"><span></span>直播</div>
      <button class="icon-btn small" id="epgBtn" aria-label="节目表" title="节目表 (E)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M4 6.5h9M4 12h9M4 17.5h9"/><circle cx="17.5" cy="6.5" r="1.6"/><circle cx="17.5" cy="12" r="1.6"/><circle cx="17.5" cy="17.5" r="1.6"/>
        </svg>
      </button>
      <button class="icon-btn small" id="favBtn" aria-label="收藏" title="收藏">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m12 4.5 2.4 5 5.4.7-4 3.8 1 5.4-4.8-2.6-4.8 2.6 1-5.4-4-3.8 5.4-.7z"/></svg>
      </button>
      <button class="icon-btn small" id="lineBtn" aria-label="切换线路" title="切换备用线路">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h11a4 4 0 0 1 0 8H9"/><path d="m12 12-3 3 3 3"/></svg>
      </button>
      <div class="volume">
        <button class="icon-btn small" id="muteBtn" aria-label="静音">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path id="wave2" d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path id="wave1" d="M18 6.5a8 8 0 0 1 0 11"/>
          </svg>
        </button>
        <input id="volume" type="range" min="0" max="100" value="80" aria-label="音量">
      </div>
      <div class="timer-wrap">
        <button class="icon-btn small" id="sleepBtn" aria-label="定时关闭" title="定时关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M9 3h6"/></svg>
        </button>
        <div class="popover" id="sleepMenu" hidden>
          <button data-min="15">15 分钟</button>
          <button data-min="30">30 分钟</button>
          <button data-min="60">60 分钟</button>
          <button data-min="90">90 分钟</button>
          <button data-min="0" class="danger">取消定时</button>
        </div>
      </div>
      <button class="icon-btn small" id="keepAwakeBtn" data-keepawake aria-label="屏幕常亮" title="屏幕常亮">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/>
        </svg>
      </button>
      <div class="elapsed" id="elapsed">00:00</div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="listen-modal" id="listenModal" hidden>
  <div class="listen-card">
    <div class="listen-head">
      <h3>在线收听</h3>
      <button class="listen-close" id="listenClose" aria-label="关闭">×</button>
    </div>
    <div class="listen-list" id="listenList">
      <p class="listen-empty">读取中…</p>
    </div>
    <div class="listen-foot">每 10 秒刷新 · 只显示正在播放的登录会话</div>
  </div>
</div>

<div class="epg-mask" id="epgMask" hidden></div>
<aside class="epg-drawer" id="epgDrawer" aria-hidden="true" hidden>
  <div class="epg-head">
    <div class="epg-head-text">
      <h3 id="epgStation">节目表</h3>
      <p id="epgMeta">选择一个电台后显示今日节目</p>
    </div>
    <button class="epg-close" id="epgClose" aria-label="关闭">×</button>
  </div>
  <div class="epg-tabs" id="epgTabs">
    <button data-day="yesterday">昨天</button>
    <button data-day="today" class="active">今天</button>
    <button data-day="tomorrow">明天</button>
  </div>
  <div class="epg-list" id="epgList">
    <p class="epg-empty">加载中…</p>
  </div>
  <div class="epg-foot">节目表数据来自公开的电台节目单索引，仅供参考</div>
</aside>

<script src="vendor/hls.min.js"></script>
<script src="version.js"></script>
<script src="switcher.js"></script>
<script src="weather.js"></script>
<script src="wakelock.js"></script>
<script src="player.js"></script>
<script src="app.js"></script>
</body>
</html>
